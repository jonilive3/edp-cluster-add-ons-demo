argo-cd:
  global:
    domain: localhost
    networkPolicy:
      create: false

  configs:
    secret:
      createSecret: true
    cm:
      url: "http://localhost:8080"
      exec.enabled: true
      # Дозволяємо ArgoCD обробляти ресурси в усіх неймспейсах для локального середовища
      resource.exclusions: ""

  params:
    # Вимикаємо обов'язковий TLS на сервері, щоб простіше заходити через HTTP / port-forward
    server.insecure: true
    # Дозволяємо керувати додатками у будь-яких неймспейсах
    applicationsetcontroller.namespaces: "*"
    application.namespaces: "*"

  rbac:
    policy.default: role:admin

  # Вимикаємо інтеграції з зовнішнім SSO/Keycloak для локального Kind
  dex:
    enabled: false

  redis:
    enabled: true

  server:
    replicas: 1
    ingress:
      enabled: false

# Вимикаємо OIDC (Keycloak) та External Secrets (AWS), бо їх немає в чистому kind
oidc:
  enabled: false

eso:
  enabled: false